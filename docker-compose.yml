services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel_net

  webserver:
    image: nginx:alpine
    container_name: laravel_webserver
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel_net

  db:
    image: postgres:15
    container_name: laravel_db
    restart: always
    environment:
      POSTGRES_DB: rrhh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - laravel_net

  django:
    build:
      context: ./djangomicroservicio
      dockerfile: Dockerfile
    container_name: django_microservicio
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    volumes:
      - ./djangomicroservicio:/app
    depends_on:
      - db
    networks:
      - laravel_net    

volumes:
  dbdata:

networks:
  laravel_net:
    driver: bridge